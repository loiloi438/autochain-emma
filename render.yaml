# Render manifest for AutoChain Emma
# - Defines a backend PHP (Laravel) web service and a frontend static site
# - Includes a free PostgreSQL database for the backend

services:
  - type: web
    name: autchain-backend
    env: docker
    plan: free
    root: .
    dockerfilePath: backend/Dockerfile
    disk: 1024
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        # Set the Laravel app key here. Generate it locally with `php artisan key:generate --show` and paste the result.
        # If you press the Render "Generate" button, it can also work, but the safest option is to paste a known APP_KEY.
        value: ""
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase: autchain-db
      - key: DB_NAME
        fromDatabase: autchain-db
      - key: DB_USER
        fromDatabase: autchain-db
      - key: DB_PASSWORD
        fromDatabase: autchain-db
      - key: BROADCAST_DRIVER
        value: log
      - key: CACHE_DRIVER
        value: file
      - key: SESSION_DRIVER
        value: file

staticSites:
  - type: static_site
    name: autchain-frontend
    root: frontend
    plan: free
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        # Set this to your backend public URL after deployment, for example:
        # https://autchain-backend.onrender.com/api
        # The frontend uses this variable to call your Laravel API.
        value: ""

databases:
  - name: autchain-db
    engine: postgresql
    plan: free
    region: oregon
    # postgresVersion: "15"  # optional

# Notes:
# - After you push this file to your repo and connect the repo on Render, create the service using the Render Dashboard or "New Service from repo" and Render will read this manifest.
# - Set APP_KEY and VITE_API_URL in Render's Environment settings (APP_KEY should be a 32+ char key generated by `php artisan key:generate`).
# - The backend service's DB connection vars are automatically mapped from the database named `autchain-db` using `fromDatabase` above.
# - If you prefer to deploy the backend with Docker, see backend/Dockerfile.
